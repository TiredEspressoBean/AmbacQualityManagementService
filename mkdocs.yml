site_name: uqmes Documentation
site_description: User documentation for uqmes — Unified Quality Manufacturing Execution System
# Served from the application host at /docs/ (see admin/deployment/documentation-site.md).
# Set site_url per deployment if canonical URLs or a sitemap are needed.

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - javascript
    - typescript
    - bash
    - yaml
    - json

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

