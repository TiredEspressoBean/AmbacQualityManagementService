[global]
# Repository configuration
# For NAS: mount your NAS at /var/lib/pgbackrest on the host
# For local: uses the pgbackrest_repo docker volume
repo1-path=/var/lib/pgbackrest

# Tiered recovery. Fulls run weekly and diffs daily (see backup-scheduler in
# docker-compose.yml), so this gives minute-granularity PITR for the last
# fortnight, day-granularity for two weeks, and week-granularity for ~3 months.
#
# 12 fulls rather than 4: what backup retention protects against is silent
# corruption or a bad actor, where the requirement is enough history to have
# noticed. Four weeks is thin for that. The audit records themselves are not the
# reason -- they live in the database, append-only behind the immutability
# triggers, and travel forward in every backup. A full measured 50.8MB, so the
# extra fulls cost little.
repo1-retention-full=12
repo1-retention-diff=14

# WAL is retained only for the 2 newest fulls. By default pgBackRest keeps
# archive for EVERY retained full, so raising full retention to 12 would drag ~3
# months of WAL with it -- and WAL volume tracks write traffic, not database
# size, so that is the line item that would actually hurt. Older fulls stay
# restorable to their own backup point; only sub-backup PITR is limited to the
# recent window.
repo1-retention-archive=2
repo1-retention-archive-type=full

# Encryption (AES-256-CBC for CMMC compliance)
repo1-cipher-type=aes-256-cbc
# Set via environment variable PGBACKREST_REPO1_CIPHER_PASS

# Compression (zstd for speed + ratio balance)
compress-type=zst
compress-level=3

# Parallel processing
process-max=2

# Logging
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Lock path
lock-path=/var/spool/pgbackrest

[tracker]
# PostgreSQL connection (local - runs inside postgres container)
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-socket-path=/var/run/postgresql